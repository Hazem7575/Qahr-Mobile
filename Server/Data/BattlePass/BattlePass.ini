; =====================================================================================================
; Martial Token (BattlePass) - season config. ONE editable file; the server reads it
; at start (restart after editing). Lines starting with ; are comments.
;
; OFFICIAL = copied from the 7957 client: ini\BattlePass.lua (server-type 0 "default" tables:
;            VIPInfo, BattlepassLevel, BattlepassScoreReward, BattlepassTask, BattlepassSeason)
;            and ini\Cn_Res.ini strings. Client and server MUST agree on these, do not change them alone.
; DERIVED  = the client does not contain this value; closest documented value, change freely.
; =====================================================================================================

[Season]
; DERIVED: which season runs is a server choice (official server sends it). The client knows seasons
;          1..122 (BattlepassSeason). 122 is the newest one (end_time 20260910). Every client season end_time is
;          already in the past, so the window's "Remaining Time" stays empty (client-side, cannot be fixed here).
;          Changing SeasonId starts a NEW season for every player (progress, token, claims reset on next login).
SeasonId=122
; DERIVED: 1 = icon + window on. 0 = off (icon hidden).
Enabled=1
; DERIVED: daily tasks reset at 00:00 server time, weekly tasks + weekly point cap on Monday 00:00.
WeekStartsOn=Monday
; OFFICIAL: Cn_Res STR_BATTLEPASS_TASK_WEEK_SCORE "Points this Week: %d/6313" (weekly cap of free task points).
WeeklyFreePointCap=6313
; DERIVED: the client multiplies nothing itself; "Free Multiply"/"Pay Multiply" (STR_BP_TASK_DOUBLE_REWARD_CONFIRM
;          "...multiply the reward") is read as x2 = one extra reward_score.
MultiplyFactor=2
; DERIVED: login-day tasks (type 121 "Log in for 3 days", 122 "5 days") count distinct login days in the week.
CumulativeLoginScope=week

[Privilege]
; OFFICIAL VIPInfo: index 1 = Superior Token (VIPInfo[0] Emoney 169), 2 = Luxurious Token (VIPInfo[1] Emoney 1599).
; Money=0 and ItemType=0 in the client, so CPs is the only way to pay. Upgrade 1->2 costs the difference
; (client CDlgBattlePassVIP shows price[target]-price[owned], dlgbattlepassvip.cpp FUN_005a72e7).
Price1=169
Price2=1599

[Store]
; OFFICIAL: client BattlePass.lua ShopInfo ShopID[0] = 108 (NPC 23923) - the "Point Store" tab. Goods and prices are the
;           server file exchange_shop_goods_ex.txt (shop 108, cost_type 2 = Hero Points, client asserts GetPriceByBattlePassPoint).
ShopId=108

