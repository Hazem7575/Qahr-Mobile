# [GuildRecruit 2026-10-14] guild applications (2351), recruitment board (2019/2048/2342),
# union applications (2384) and league order status (2393). key=value, read once at first use.
ApplyExpireHours=72         # derived: an application waits 3 days at most
MaxApplicationsPerGuild=50  # derived: queue size per guild / union
MaxPendingPerPlayer=5       # derived: open applications per hero
AdMinBid=500000             # official: STR_ISSUE_RECRUIT_FEE_TIP2 (at least 500,000 silver, from the Guild Fund)
AdMaxBid=2000000000         # derived: upper limit of one bid
AdDays=7                    # official: STR_ISSUE_RECRUIT_CONFIRM (7-day advertisement)
AdPageSize=5                # derived: ads per board page
AdTextMax=250               # derived: characters kept from the ad text
GuildPledgeNeedsApproval=1  # derived: 1 = a guild pledge to a union waits for the union leader, 0 = joins at once (old behaviour)
RateLimitMs=400             # derived: minimum gap between two requests of one kind
