; [Auction 2026-10-14] Auction House (CDlgAuction #572). official = 7957 client, derived = server choice.
[Auction]
Enabled=1
ListingHours=48            ; official: STR_AUCTION_SELL_TIME "Duration: 48 hours"
MaxListings=10             ; official: client default of Info.ini AuctionMyList
PageSize=7                 ; official: 7 rows per page in the client lists
RequireDelistFirst=1        ; official: STR_AUCTION_HAS_TIME_OUT_ITEM (delist expired items before listing)
MinUnitPrice=1              ; derived
MaxTotalPrice=2000000000    ; derived (client price fields are u32)
ListingFeePermille=10       ; derived: 10 = 1% of the total price, paid in CPs when listing, not refunded
MinListingFee=1             ; derived
SalesTaxPermille=0          ; derived: cut taken from the seller's income (0 = none)
ExpiryCheckSeconds=30       ; derived
ActionIntervalMs=500       ; derived (per player rate limit of write actions)
ListIntervalMs=300         ; derived (per player rate limit of list requests)
KeepClosedDays=30           ; derived
