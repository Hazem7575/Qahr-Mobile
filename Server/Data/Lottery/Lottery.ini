; [Lottery 2026-10-14] Config of Base\Lottery (Golden Tree 2005/2391 + turnover flop lottery 2102/2069).
; Official data is NOT in this file: it comes straight from the client files
;   Lottery\globallotterycondition.ini  = copy of client ini\globallotterycondition.ini (condition id, ticket item, CD, CD cost)
;   ..\global_lottery_pool.txt          = client global_lottery_pool.dat (prizes + quantity per bloom = the odds)
;   Lottery\TurnoverLottery.ini         = copy of client ini\TurnoverLottery.ini (prices, flips, award list)
;   ..\cards_lottery_pool.txt           = client cards_lottery_pool.dat (award items)
; Everything below is DERIVED (the official server values are not in the client).

[GlobalLottery]
Enabled=1
; daily blooms "HH:MM@conditionId" (condition id from the client ini). 08:00 / 17:00 / 21:00 = the official
; 2018 Rune bloom times in the client ini; 247 = "The discovery of the Runes..." (pool type 197, ticket RunedStar 3304541)
Blooms=08:00@247,17:00@247,21:00@247
; pre-phase ("Golden Tree is about to bloom") and bloom length: old client globallotterycondition.dat 07:55 / 08:00 / 10:59
PreMinutes=5
BloomMinutes=179
; anti-spam between two pick packets (the real pace is the client CD from the condition: 60 s)
PickIntervalMs=300

[Turnover]
Enabled=1
; weight of each award by its index in ItemTypeID0..7 (index 0 = best). The client has no odds column.
Weights=1,3,6,10,20,20,20,20
; awards with index <= TopIndex go to the winners list (2069) and the "%s was so lucky to flop %s!" broadcast
TopIndex=3
FlipIntervalMs=500
; an opened flop board expires after this many minutes
SessionMinutes=10
RankKeep=50
RankPageSize=10
; empty = every client lottery type whose awards exist and whose currency exists here (1 CPs, 2 CPs(B)+CPs, 3 Silver, 7/8/9 item)
EnabledTypes=
