; [GiftCenter 2026-10-14] Gift Center config (Base\GiftCenter). Read at server start.
; "official" = taken from the 7957 client (ini\Face.lua / hairface_storage_type.dat), "derived" = server choice.
; The giftable list and every price come from Infinity[DB]\hairface_storage_type.txt (same bytes as the client .dat),
; using the client's own rule: get-way column != 6, avatars Silver-priced and >= MinAvatarPrice.
[GiftCenter]
Enabled=1
AskLimitPerDay=10            ; official  Face_GetAskTimesLimitOneDay
RecordLifetimeDays=30        ; official  Face_GetLogSaveTime = 2592000 s
MinAvatarPrice=10000000      ; official  Face_GetFaceLimitMoney
DuplicateAvatarItem=3300136  ; official  Face.lua: gift of an avatar you already own -> this item x1
DuplicateFrameItem=3312060   ; official  Face.lua: same for a frame
MaxReceived=100              ; derived   "The player`s gift list is full." above this
MaxAsks=100                  ; derived   asks waiting in one player's list
MaxSentLog=100               ; derived   oldest sent-log rows are dropped above this
RequireFriend=1              ; derived   the client only offers friends as targets
RequireTargetOnline=1        ; derived   "The player is offline." (STR_GIFT_TO_FRIEND_ERROR_4)
ActionIntervalMs=800         ; derived   send / ask / claim / refuse / delete rate limit
ListIntervalMs=300           ; derived   list / setting rate limit
