# [NewGuildWar 2026-10-14] New Guild War (packet 2061). One value per line: key=value. Read at server start
# (delete nothing; a missing key keeps its default). "official" = from the 7957 client, "derived" = chosen here.
Enabled=1
Day=0                 # official: lua NewSynWarData (0 = Sunday ... 6 = Saturday)
StartHHMM=1430        # official: lua NewSynWarTime (14:30 server time)
DurationMin=30        # derived: the war ends with the Honor Pillar window (14:55 + 5 min)
BossOffsetMin=25      # official: lua BossStartTime 1455 (25 min after the start)
BossMinutes=5         # official: lua BossEndTime 1500 / STR_NEW_SYN_WARINFO_BOSS_1 (5 min)
BossHp=120000000      # official: STR_NEW_SYN_WARINFO_BOSS_1
BossX=77              # official: lua BossPosX (nearest walkable tile is used)
BossY=77              # official: lua BossPosY
BossUid=19810         # derived: object id of the Honor Pillar
Map=1038              # official: lua SynMapDoc (the Guild War map; Guild Pillar = pole 810)
PillarPoints=3000     # official: STR_NEW_SYN_WARINFO_SYN_COLUMN1
GatePoints=500        # official: STR_NEW_SYN_WARINFO_DOOR_1 / _2 (each gate)
HonorPoints=3000      # official: STR_NEW_SYN_WARINFO_BOSS_1
HeroPool=3000         # official: 10,000 total - 7,000 object points
CpFund=10000          # official: STR_NEW_SYN_WARINFO_AWARD_INFO1 (Guild CP fund split by points)
WinnerLeaderCps=3000  # official: STR_NEW_SYN_WARINFO_AWARD_INFO1 (extra CPs for the winning guild leader)
RobPercent=80         # official: STR_NEW_SYN_WARINFO_HERO_SCORE2
DeadRecycleSec=30     # official: STR_NEW_SYN_WARINFO_HERO_SCORE2
KillGrant=20          # derived: pool points for killing an enemy guild member
KillGrantCooldownSec=60 # derived: the same victim gives pool points once a minute
PreCountdownMin=10    # derived: start countdown shown on the war map before the start
HudIntervalSec=10     # derived: in-war ranking refresh
RankRows=10           # derived: rows in the rankings
MinGuildLevel=1       # derived: guild level needed to score
