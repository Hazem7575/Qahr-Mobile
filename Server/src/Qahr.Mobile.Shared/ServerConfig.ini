; ============================================================
; [AutoPatch] update server of the mobile client (AccServer, port [Server] AutoPatchPort = 9547).
;   Mode=Ready   always answer READY (no update) - the default
;   Mode=Update  serve PatchDir\NNNN.zip patches (docs\AUTOPATCH.md); needs an AccServer restart
;   PatchDir     zips of the updates (D:\Qahr Mobile\Updates, outside the source)
;   HttpPort     built-in HTTP server for the zips (default 9549; 9548 is MobileRegisterPort; 0 = none, then set UrlBase to your web server)
;   UrlBase      host:port/path the phones download from (default IP:HttpPort/patch)
; ============================================================
[AutoPatch]
Mode=Update
PatchDir=D:\Qahr Mobile\Updates
HttpPort=9549
;UrlBase=26.31.69.47:9549/patch

; ============================================================
