; ============================================================
;   Central server configuration (QahrMobile: copy of Infinity 7957 for the Conquer Online Mobile client)
;   Edit here only - both the game server and the account server read from this file.
;   Location: D:\conquer\QahrMobile\Qahr.Shared\ServerConfig.ini (servers search up the tree for Qahr.Shared\ServerConfig.ini)
; ============================================================

; ============================================================
; [Server] game-server identity + bind settings. Moved here from shell.ini [ServerInfo]
; (2026-10-17) so the IP / port / name live in one place. shell.ini is still read as a
; fallback if a key is missing here. Change the IP in all 3 layers when it changes
; (here, the MySQL Servers table, and Server.dat).
; ============================================================
[Server]
MobileRegisterPort=9548
; Accounts one e-mail may own (mobile Register asks for an e-mail, used by "Forgot password?").
MobileAccountsPerEmail=5
; IP the client connects to for the game server.
IP=26.31.69.47
; Game-server listen port.
GamePort=5828
; Server display name.
ServerName=Qahr
; AccServer login listen port (the client connects here first).
LoginPort=16100
; 1 = inter-server node | 0 = normal single server.
IsInterServer=0
; Data folder (Data) and the CO2 client folder (usually the same path). REQUIRED to run.
DataFolder=D:\conquer\QahrMobile\Data\
CO2Folder=D:\conquer\QahrMobile\Data\

[Database]
Host=localhost
Port=3306
User=hazem
Password=gsa5NxHa0MUsc12_LncPtMkM
Name=qahr_mobile

[Storage]
; Player storage backend. MySql is the ONLY supported mode (File/Dual were removed). Keep this = MySql.
PlayerBackend=MySql
; 1 = write each player's .ini atomically once (tmp + Replace) | 0 = old key-by-key way
AtomicIni=1
; 1 = mirror the database (UPSERT to MySQL) on a background queue instead of the gameplay thread | 0 = synchronous, exactly like before
AsyncMirror=1
; Where character data is read at login: File = the file | Verify = file + compare every value against the DB (storage_verify.txt) | Db = the DB (file is the fallback)
PlayerReadSource=Db
; Number of queue threads (each player/guild is pinned to one thread, so ordering is preserved)
AsyncMirrorWorkers=2
; Max pending operations (if the DB is down: new saves are dropped with a warning, files are still saved)
AsyncMirrorMaxQueue=20000
; Queue flush timeout on server shutdown (seconds)
AsyncMirrorFlushSec=8

[Diagnostics]
; Every N seconds print one performance line to the console (players/packets/saves/tick/GC/memory/CPU) | 0 = off
PerfReportSeconds=60
; Map-load benchmark (diagnostics only): 1 = after boot, load the Traps.txt maps and write the summary to mapload_log.txt
MapLoadBench=0

[Network]
; Network engine for the game server (read once at startup, needs a restart):
; Legacy = the old one (polling every 1ms + BeginSend per packet) - the default
; V2     = async receive (IOCP) with no polling + an ordered send queue per connection
NetEngine=V2
; V2 only: max bytes waiting to be sent per player before they get disconnected (0 = no limit)
MaxSendQueueKB=4096
; V2 only: max size of a single send batch (several packets in one syscall)
SendBatchKB=64
; 1 = tell the GC about each Packet's native memory (16KB) so it is freed on time | 0 = as before
PacketMemoryPressure=1
; GameServer listen-socket tuning (moved from shell.ini [InternetPort]).
BackLog=100
ReceiveSize=6844
SendSize=6844

; ============================================================
; [Rates] experience multipliers - change LIVE with no restart:
;   1) edit the value here   2) from the console/AdminApi run:  reloadrates
; ============================================================
[Rates]
; General player experience multiplier
UserExpRate=2
; Spell experience multiplier
ExpRateSpell=3
; Proficiency (weapon skill) experience multiplier
ExpRateProf=3

; ============================================================
; [AdminApi] local admin API (HTTP + TCP, loopback 127.0.0.1 only; needs Data\adminapi.txt for port+secret).
; No UI/panel is served from the game source - build your panel separately and point it at the API endpoints
; (GET /api/status, /api/players, /api/packages ; POST /api/exec). Every call carries the secret / an HMAC signature.
; ============================================================
[AdminApi]
; 1 = allow WRITE actions through the API (add CPs, give package) | 0 = read-only (status/players/packages only).
; Live: change it and it applies on the next request (no restart). Keep it 0 unless you are actively editing.
AllowWrites=0

; ============================================================
; [Security] login-token + brute-force / connection limits (moved from shell.ini [Security]).
; ============================================================
[Security]
; GameServer: one-time login-token lifetime (seconds) + bind it to the client IP (1/0).
LoginTokenTtlSeconds=600
LoginTokenBindIp=0
; AccServer: brute-force protection + per-IP connection cap.
MaxLoginFailures=6
LoginBlockMinutes=5
LoginFailureWindowMinutes=5
MaxConnectionsPerIp=32

